<title>グッズメニュー</title>
<style>
  :root {
    --bg: #faf8f5; --panel: #ffffff; --fg: #1d1b20; --muted: #6b6672; --line: #e8e3dc;
    --accent: #d2386c; --out: #c62828; --out-bg: rgba(255,255,255,.72);
    --font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "PingFang SC", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141216; --panel: #1e1b21; --fg: #f1edf3; --muted: #a59fab; --line: #322d37;
      --accent: #f06292; --out: #ff6b6b; --out-bg: rgba(20,18,22,.72);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.45; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
  header { text-align: center; padding: 8px 0 16px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .06em; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .hello { margin: 10px 0 0; font-size: 14px; line-height: 1.6; }
  .hello.en { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 8px; border-bottom: 1px solid var(--line); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  nav::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
  .chips button { flex: none; font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .chips button:focus-visible, .linkbtn:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tools { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 10px 0 0; }
  .tools .row2 { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .linkbtn { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 2px 0; text-decoration: underline; cursor: pointer; }
  nav button { flex: none; font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; letter-spacing: .02em; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  nav button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.ctl { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  section { margin-top: 18px; }
  h2 { font-size: 22px; margin: 18px 0 4px; letter-spacing: .04em; }
  details.cat { border-top: 1px solid var(--line); }
  details.cat > summary { list-style: none; cursor: pointer; padding: 12px 0; display: flex; align-items: center; gap: 10px; }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary::after { content: "▾"; color: var(--muted); font-size: 16px; transition: transform .15s; }
  details.cat:not([open]) > summary::after { transform: rotate(-90deg); }
  details.cat[open] > summary { padding-bottom: 8px; }
  details.cat .grid { padding-bottom: 16px; }
  h3 { font-size: 15px; margin: 0; flex: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  h3 .cnt { flex-basis: 100%; font-size: 12px; color: var(--muted); font-weight: 400; }
  h3 .en { font-size: 11px; color: var(--muted); letter-spacing: .08em; font-weight: 500; }
  h3 .price { margin-left: auto; color: var(--accent); font-size: 15px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card.incart { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .pic { position: relative; display: block; width: 100%; aspect-ratio: 1; overflow: hidden; background: var(--bg); border: 0; padding: 0; cursor: zoom-in; }
  .card .pic:focus-visible, .qty button:focus-visible, .addbtn:focus-visible, .cartbar:focus-visible, .sheet button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .cap { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; }
  .incnt { position: absolute; top: 8px; right: 8px; z-index: 1; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; pointer-events: none; }
  .addbtn { font: inherit; font-size: 20px; font-weight: 700; line-height: 1; width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .qty { display: inline-flex; align-items: center; gap: 2px; border-radius: 999px; background: var(--accent); color: #fff; }
  .qty button { font: inherit; font-size: 18px; font-weight: 700; width: 32px; height: 32px; border: 0; background: transparent; color: #fff; cursor: pointer; padding: 0; line-height: 1; }
  .qty span { min-width: 1.4em; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; }
  .cartbar { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); width: min(560px, calc(100% - 32px)); display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 0; border-radius: 14px; background: var(--fg); color: var(--bg); font: inherit; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.25); text-align: left; }
  .cartbar[hidden] { display: none; }
  .cartbar b { font-size: 16px; } .cartbar .go { margin-left: auto; font-weight: 700; font-size: 14px; white-space: nowrap; }
  body.hascart .wrap { padding-bottom: 110px; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet[hidden] { display: none; }
  .sheet .in { max-width: 640px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .sheet .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sheet h2 { margin: 6px 0; font-size: 22px; }
  .sheet .hint { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px dashed var(--accent); font-size: 14px; text-align: center; }
  .sheet ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .sheet li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sheet li:last-child { border-bottom: 0; }
  .sheet li img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; display: block; background: var(--bg); }
  .sheet .t1 { font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
  .sheet .t2 { font-size: 12px; color: var(--muted); }
  .sheet .t3 { font-size: 13px; font-variant-numeric: tabular-nums; }
  .sheet .r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .sheet .sub2 { font-weight: 800; font-variant-numeric: tabular-nums; }
  .sheet li.gone .t1, .sheet li.gone .sub2 { text-decoration: line-through; color: var(--muted); }
  .sheet li.gone .t2 { color: var(--out); font-weight: 700; }
  .sheet .total { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 4px 6px; font-size: 18px; font-weight: 700; }
  .sheet .total b { font-size: 30px; font-variant-numeric: tabular-nums; }
  .sheet .btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .sheet .btn { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .sheet .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .sheet .x { font: inherit; font-size: 18px; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .lbadd { margin-top: 4px; }
  .lbadd .addwide { font: inherit; font-weight: 700; font-size: 15px; padding: 9px 18px; border-radius: 999px; border: 0; background: #fff; color: #1d1b20; cursor: pointer; }
  .lbadd .qty { background: #fff; color: #1d1b20; } .lbadd .qty button { color: #1d1b20; }
  .card .nm { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
  .card .pr { color: var(--accent); font-weight: 700; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card.out .pic, .card.out .cap { opacity: .45; filter: grayscale(1); }
  .card.out::after, .badge { pointer-events: none; }
  .card.out::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, transparent calc(50% - 2px), var(--out) calc(50% - 2px), var(--out) calc(50% + 2px), transparent calc(50% + 2px)),
                linear-gradient(to top left, transparent calc(50% - 2px), var(--out) calc(50% - 2px), var(--out) calc(50% + 2px), transparent calc(50% + 2px)); }
  .badge { position: absolute; z-index: 2; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-8deg); background: var(--out); color: #fff; font-weight: 800; font-size: 14px; letter-spacing: .08em; padding: 4px 10px; border-radius: 6px; white-space: nowrap; text-align: center; line-height: 1.25; }

  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 28px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: grid; place-items: center; padding: 16px; z-index: 10; cursor: zoom-out; }
  .lightbox[hidden] { display: none; }
  .lightbox figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: min(94vw, 720px); }
  .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 10px; }
  .lightbox figcaption { color: #fff; font-size: 15px; text-align: center; }
  .lightbox .count { color: rgba(255,255,255,.7); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lightbox figure { touch-action: pan-y; user-select: none; }
  .lightbox img { transition: transform .18s ease, opacity .18s ease; }
  .nav-btn, .close { position: absolute; border: 0; background: rgba(255,255,255,.16); color: #fff; cursor: pointer; display: grid; place-items: center; font: inherit; }
  .nav-btn { top: 50%; transform: translateY(-50%); width: 44px; height: 64px; font-size: 34px; border-radius: 10px; line-height: 1; }
  .nav-btn.prev { left: max(8px, env(safe-area-inset-left)); } .nav-btn.next { right: max(8px, env(safe-area-inset-right)); }
  .nav-btn[hidden] { display: none; }

  .nav-btn:focus-visible, .close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @media (max-width: 560px) { .nav-btn { width: 36px; height: 52px; font-size: 28px; background: rgba(255,255,255,.12); } }
  @media (max-width: 380px) { nav button { font-size: 12px !important; padding: 6px 9px !important; } }

</style>
</head>

<button type="button" class="cartbar" id="cartbar" hidden></button>

m": "k2", "category": "团扇钥匙链", "item": "MOCHI", "name": "MOCHI", "price": 1000, "img": "k2-mochi-mini.jpg"}, {"form": "k2", "category": "小手幅", "item": "GAKURAN", "name": "GAKURAN", "price": 1000, "img": "k2-gakuran-mini.jpg"}, {"form": "k2", "category": "小手幅", "item": "CINNAMOROLL", "name": "CINNAMOROLL", "price": 1000, "img": "k2-cinnamoroll-mini.jpg"}, {"form": "k2", "category": "团扇钥匙链", "item": "FUFFLY", "name": "FLUFFY", "price": 1000, "img": "k2-fluffy-mini.jpg"}, {"form": "k2", "category": "团扇钥匙链", "item": "ALIEN", "name": "ALIEN", "price": 1000, "img": "k2-alien-mini.jpg"}, {"form": "unit", "category": "手幅", "item": "Wonderland", "name": "Wonderland", "price": 2500, "img": "unit-wonderland.jpg"}, {"form": "unit", "category": "手幅", "item": "Echo", "name": "Echo", "price": 2500, "img": "unit-echo.jpg"}, {"form": "unit", "category": "手幅", "item": "J x J", "name": "J x J", "price": 2500, "img": "unit-jxj.jpg"}, {"form": "unit", "category": "团扇钥匙链", "item": "Daydream", "name": "Daydream", "price": 1000, "img": "unit-daydream-mini.jpg"}, {"form": "unit", "category": "团扇", "item": "Daydream", "name": "Daydream", "price": 2500, "img": "unit-daydream.jpg"}]};
const CATS = {
  '手幅': ['スローガン', 'SLOGAN'],
  '小手幅': ['ミニスローガンキーホルダー', 'MINI SLOGAN KEYCHAIN'],
  '团扇': ['うちわ', 'UCHIWA'],
  '团扇钥匙链': ['ミニうちわキーホルダー', 'MINI UCHIWA KEYCHAIN'],
  '小手幅/团扇钥匙链': ['ミニキーホルダー', 'MINI KEYCHAIN'],
};
const ORDER = Object.keys(CATS);
const fname = (f) => (MENU.form_names || {})[f] || f.toUpperCase();
const key = (it) => `${it.form}|${it.category}|${it.item}`;
const yen = (n) => '¥' + n.toLocaleString('ja-JP');
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else n.setAttribute(k, v); }
  for (const k of kids) n.append(k);
  return n;
};
let soldOut = new Set();
// 购物车：只存在客人自己手机里（localStorage），不上传
let cart = {};
try { cart = JSON.parse(localStorage.getItem('menu-cart') || '{}') || {}; } catch (e) {}
const byKey = Object.fromEntries(MENU.items.map((it) => [key(it), it]));
for (const k of Object.keys(cart)) if (!byKey[k] || !(cart[k] > 0)) delete cart[k];
const saveCart = () => { try { localStorage.setItem('menu-cart', JSON.stringify(cart)); } catch (e) {} };
const MAXQ = 20;
function setQty(k, q) {
  q = Math.max(0, Math.min(MAXQ, q));
  if (q) cart[k] = q; else delete cart[k];
  saveCart(); render(); renderCart();
  if (!lb.hidden) lbShow(lbIdx);
}
function qtyControl(k, big) {
  const q = cart[k] || 0;
  if (!q) {
    const b = big ? el('button', { type: 'button', class: 'addwide' }, '＋ カートに入れる / Add')
                  : el('button', { type: 'button', class: 'addbtn', 'aria-label': 'カートに入れる / Add to cart' }, '＋');
    b.onclick = (e) => { e.stopPropagation(); setQty(k, 1); };
    return b;
  }
  const minus = el('button', { type: 'button', 'aria-label': '1つ減らす' }, '−');
  const plus = el('button', { type: 'button', 'aria-label': '1つ増やす' }, '＋');
  minus.onclick = (e) => { e.stopPropagation(); setQty(k, q - 1); };
  plus.onclick = (e) => { e.stopPropagation(); setQty(k, q + 1); };
  return el('span', { class: 'qty' }, minus, el('span', { 'aria-live': 'polite' }, String(q)), plus);
}
const state = { tab: MENU.forms[0], hideOut: false, closed: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem('menu-view') || '{}')); } catch (e) {}
if (!MENU.forms.includes(state.tab)) state.tab = MENU.forms[0];
const save = () => { try { localStorage.setItem('menu-view', JSON.stringify(state)); } catch (e) {} };

const lb = document.getElementById('lb');
// 大图：同一分类里左右滑动 / 点箭头 / 键盘左右键切换
let lbList = [], lbIdx = 0;
const lbImg = lb.querySelector('img');
function lbShow(i, dir = 0) {
  lbIdx = (i + lbList.length) % lbList.length;
  const it = lbList[lbIdx];
  lbImg.style.transition = 'none';
  lbImg.style.transform = dir ? `translateX(${dir * 40}px)` : '';
  lbImg.style.opacity = dir ? '0' : '1';
  lbImg.src = 'img/' + it.img;
  lb.querySelector('figcaption').textContent = `${it.name} · ${it.jp}${it.price ? ' · ' + yen(it.price) : ''}${it.out ? ' · SOLD OUT 完売' : ''}`;
  document.getElementById('lbadd').replaceChildren(...(it.out ? [] : [qtyControl(key(it), true)]));
  lb.querySelector('.count').textContent = lbList.length > 1 ? `${lbIdx + 1} / ${lbList.length}` : '';
  lb.querySelectorAll('.nav-btn').forEach((b) => { b.hidden = lbList.length < 2; });
  requestAnimationFrame(() => requestAnimationFrame(() => { lbImg.style.transition = ''; lbImg.style.transform = ''; lbImg.style.opacity = '1'; }));
  const nx = lbList[(lbIdx + 1) % lbList.length]; if (nx) new Image().src = 'img/' + nx.img; // 预先载入下一张
}
function lbOpen(list, i) { lbList = list; lb.hidden = false; lbShow(i); }
const lbClose = () => { lb.hidden = true; };
lb.onclick = (e) => { if (e.target === lb || e.target.closest('.close')) lbClose(); };
lb.querySelector('.prev').onclick = () => lbShow(lbIdx - 1, -1);
lb.querySelector('.next').onclick = () => lbShow(lbIdx + 1, 1);
lbImg.onclick = (e) => e.stopPropagation();
let tx = null, ty = 0;
lb.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lb.addEventListener('touchmove', (e) => { if (tx == null || lbList.length < 2) return; const dx = e.touches[0].clientX - tx; if (Math.abs(dx) > Math.abs(e.touches[0].clientY - ty)) { lbImg.style.transition = 'none'; lbImg.style.transform = `translateX(${dx}px)`; } }, { passive: true });
lb.addEventListener('touchend', (e) => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (lbList.length > 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbShow(lbIdx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
  else { lbImg.style.transition = ''; lbImg.style.transform = ''; if (dy > 90 && Math.abs(dy) > Math.abs(dx)) lbClose(); }
});
document.addEventListener('keydown', (e) => {
  if (lb.hidden) return;
  if (e.key === 'Escape') lbClose();
  else if (e.key === 'ArrowRight') lbShow(lbIdx + 1, 1);
  else if (e.key === 'ArrowLeft') lbShow(lbIdx - 1, -1);
});

function render() {
  document.getElementById('tabs').replaceChildren(...MENU.forms.map((f) => {
    const b = el('button', { type: 'button', 'aria-pressed': String(state.tab === f) }, fname(f));
    b.onclick = () => { state.tab = f; save(); render(); window.scrollTo({ top: 0 }); };
    return b;
  }));
  const items = MENU.items.filter((it) => it.form === state.tab);
  const cats = [...new Set(items.map((it) => it.category))].sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99);
  const sec = el('section', {}, el('h2', {}, fname(state.tab)));
  const chips = [];
  for (const c of cats) {
    const all = items.filter((it) => it.category === c).map((it) => ({ ...it, out: soldOut.has(key(it)) }));
    const list = all.filter((it) => !(state.hideOut && it.out)).sort((a, b) => a.out - b.out);
    if (!list.length) continue;
    const [jp, en] = CATS[c] || [c, ''];
    const prices = [...new Set(list.map((it) => it.price).filter(Boolean))];
    const outN = all.filter((it) => it.out).length;
    const ck = state.tab + '|' + c;
    const det = el('details', { class: 'cat', id: 'cat-' + ORDER.indexOf(c) },
      el('summary', {}, el('h3', {}, jp, el('span', { class: 'en' }, en), el('span', { class: 'price' }, prices.length === 1 ? yen(prices[0]) : ''),
        el('span', { class: 'cnt' }, `${all.length} 種類` + (outN ? ` · 完売 ${outN}` : '')))));
    det.open = !state.closed[ck];
    det.addEventListener('toggle', () => { if (det.open) delete state.closed[ck]; else state.closed[ck] = 1; save(); });
    chips.push([jp, det]);
    det.append(el('div', { class: 'grid' }, ...list.map((it) => {
      const k = key(it), q = cart[k] || 0;
      const pic = el('button', { type: 'button', class: 'pic', 'aria-label': `${it.name} ${jp} 画像を拡大${it.out ? '（完売）' : ''}` },
        it.img ? el('img', { src: 'img/' + it.img, alt: '', loading: 'lazy' }) : '');
      const card = el('div', { class: 'card' + (it.out ? ' out' : '') + (q && !it.out ? ' incart' : '') }, pic,
        el('div', { class: 'cap' }, el('span', { class: 'nm' }, it.name),
          el('div', { class: 'row' }, el('span', { class: 'pr' }, it.price ? yen(it.price) : ''), ...(it.out ? [] : [qtyControl(k)]))));
      if (q && !it.out) card.append(el('span', { class: 'incnt', 'aria-hidden': 'true' }, '×' + q));
      if (it.out) card.append(el('div', { class: 'badge' }, 'SOLD OUT', el('small', {}, '完売')));
      pic.onclick = () => {
        const withImg = list.filter((x) => x.img).map((x) => ({ ...x, jp }));
        const i = withImg.findIndex((x) => key(x) === key(it));
        if (i >= 0) lbOpen(withImg, i);
      };
      return card;
    })));
    sec.append(det);
  }
  document.getElementById('chips').replaceChildren(...chips.map(([jp, det]) => {
    const b = el('button', { type: 'button' }, jp);
    b.onclick = () => {
      det.open = true;
      const y = det.getBoundingClientRect().top + window.scrollY - document.getElementById('sticky').offsetHeight - 4;
      window.scrollTo({ top: y, behavior: 'smooth' });
    };
    return b;
  }));
  document.getElementById('menu').replaceChildren(sec);
}

const hz = document.getElementById('hideout');
hz.checked = state.hideOut;
hz.onchange = () => { state.hideOut = hz.checked; save(); render(); };
const setAll = (open) => {
  for (const c of ORDER) { const k = state.tab + '|' + c; if (open) delete state.closed[k]; else state.closed[k] = 1; }
  save(); render();
};
document.getElementById('openall').onclick = () => setAll(true);
document.getElementById('closeall').onclick = () => setAll(false);

// 购物车底栏 + 给拿货人看的清单
const cartbar = document.getElementById('cartbar'), sheet = document.getElementById('sheet');
const cartLines = () => Object.entries(cart).map(([k, q]) => ({ ...byKey[k], k, q, out: soldOut.has(k) }))
  .sort((a, b) => MENU.forms.indexOf(a.form) - MENU.forms.indexOf(b.form) || ORDER.indexOf(a.category) - ORDER.indexOf(b.category) || a.name.localeCompare(b.name));
function renderCart() {
  const lines = cartLines(), ok = lines.filter((l) => !l.out);
  const n = ok.reduce((s, l) => s + l.q, 0), sum = ok.reduce((s, l) => s + l.q * (l.price || 0), 0);
  cartbar.hidden = !lines.length;
  document.body.classList.toggle('hascart', lines.length > 0);
  cartbar.replaceChildren(el('span', { 'aria-hidden': 'true' }, '🛒'), el('b', {}, `${n}点 · ${yen(sum)}`), el('span', { class: 'go' }, 'リストを見る / View ›'));
  if (sheet.hidden) return;
  const close = el('button', { type: 'button', class: 'x', 'aria-label': '閉じる / Close' }, '✕');
  close.onclick = closeSheet;
  const body = lines.length ? el('ul', {}, ...lines.map((l) => el('li', { class: l.out ? 'gone' : '' },
      l.img ? el('img', { src: 'img/' + l.img, alt: '' }) : el('span'),
      el('div', {}, el('div', { class: 't1' }, l.name), el('div', { class: 't2' }, l.out ? '完売 / SOLD OUT' : `${fname(l.form)} · ${(CATS[l.category] || [l.category])[0]}（${l.category}）`),
        el('div', { class: 't3' }, `${yen(l.price || 0)} × ${l.q}`)),
      el('div', { class: 'r' }, el('span', { class: 'sub2' }, yen((l.price || 0) * l.q)), l.out ? (() => { const b = el('button', { type: 'button', class: 'btn' }, '削除'); b.onclick = () => setQty(l.k, 0); return b; })() : qtyControl(l.k)))))
    : el('p', { class: 'hint' }, 'カートは空です / Your cart is empty');
  const clear = el('button', { type: 'button', class: 'btn' }, 'すべて削除 / Clear');
  clear.onclick = () => { if (confirm('カートを空にしますか？ / Clear the cart?')) { cart = {}; saveCart(); render(); renderCart(); } };
  const back = el('button', { type: 'button', class: 'btn primary' }, '‹ 買い物を続ける');
  back.onclick = closeSheet;
  document.getElementById('sheetin').replaceChildren(
    el('div', { class: 'top' }, el('h2', {}, 'ご注文リスト'), close),
    el('p', { class: 'hint' }, 'この画面をスタッフにお見せください', el('br'), 'Please show this screen to our staff'),
    body,
    el('div', { class: 'total' }, el('span', {}, `合計 ${n}点`), el('b', {}, yen(sum))),
    ...(lines.some((l) => l.out) ? [el('p', { class: 't2', style: 'text-align:right;margin:0 4px' }, '完売の商品は合計に含まれていません')] : []),
    el('div', { class: 'btns' }, ...(lines.length ? [clear] : []), back));
}
function openSheet() { sheet.hidden = false; document.body.style.overflow = 'hidden'; renderCart(); sheet.scrollTop = 0; history.pushState({ sheet: 1 }, ''); }
function closeSheet() { if (!sheet.hidden) { sheet.hidden = true; document.body.style.overflow = ''; if (history.state && history.state.sheet) history.back(); } }
window.addEventListener('popstate', () => { if (!sheet.hidden) { sheet.hidden = true; document.body.style.overflow = ''; } });
cartbar.onclick = openSheet;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

// 没货状态：管理页（admin.html）写进 soldout.json
async function loadStock() {
  try {
    const r = await fetch(`soldout.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const next = new Set((await r.json()).soldout || []);
    if ([...next].sort().join() !== [...soldOut].sort().join()) { soldOut = next; render(); renderCart(); }
  } catch (e) { console.warn(e); }
}
render();
renderCart();
loadStock();
setInterval(loadStock, 30 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStock(); });
</script>
