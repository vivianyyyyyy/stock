<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周边备货清单</title>
<style>
  /* 拣货单式布局：顶部汇总，下面按表单 → 分类 → 款式逐行列出 */
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --fg: #1b2230; --muted: #5d6676; --line: #e1e4ea;
    --d0: #2f6fd6; --d1: #e0892b; --d2: #3a9d74; --d3: #8a5cc7;
    --warn-bg: #fff4e0; --warn-fg: #8a5300; --bad-bg: #fde8e8; --bad-fg: #a12626;
    --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --fg: #e8ebf0; --muted: #9aa3b2; --line: #2c3340;
      --d0: #6b9cf0; --d1: #f0a35a; --d2: #5fc196; --d3: #b28be6;
      --warn-bg: #3a2c12; --warn-fg: #f3c77a; --bad-bg: #3d1b1b; --bad-fg: #f2a1a1;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .banner { border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .banner.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tabs button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--d0); outline-offset: 2px; }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  select { font: inherit; font-size: 14px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--muted); letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  .tile .v { font-family: var(--num); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #forms { display: flex; flex-direction: column; gap: 24px; }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 4px 0; border-radius: 6px; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: "▸"; color: var(--muted); font-size: 14px; width: 1em; transition: transform .15s; display: inline-block; }
  .group[open] > summary::before { transform: rotate(90deg); }
  .group > summary:focus-visible { outline: 2px solid var(--d0); outline-offset: 2px; }
  .group > summary .t { font-size: 20px; font-weight: 700; }
  .group > summary small { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .group[open] > summary { margin-bottom: 2px; }
  .catblock { display: flex; flex-direction: column; gap: 8px; }
  .catblock h3 { margin: 6px 0 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
  .catblock h3 small { font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .linkbtn:focus-visible { outline: 2px solid var(--d0); outline-offset: 2px; }
  .linkbtn { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 4px 2px; cursor: pointer; text-decoration: underline; }
  .board { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .row { display: grid; grid-template-columns: 2.2em 76px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .rank { font-family: var(--num); font-size: 15px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .row:nth-child(-n+3) .rank { color: var(--fg); font-weight: 700; font-size: 18px; }
  .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; font-variant-numeric: tabular-nums; }
  .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .tag { padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); }
  .bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar span { display: block; height: 100%; }
  .qty { font-family: var(--num); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; min-width: 2.5em; }
  .qty small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .zero .name, .zero .qty { color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .thumb { display: block; width: 76px; height: 76px; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb:focus-visible { outline: 2px solid var(--d0); outline-offset: 2px; }
  .noimg { display: grid; place-items: center; width: 76px; height: 76px; border: 1px dashed var(--line); border-radius: 8px; font-size: 12px; color: var(--muted); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px; z-index: 10; cursor: zoom-out; }
  .lightbox[hidden] { display: none; }
  .lightbox figure { margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; max-width: min(92vw, 720px); }
  .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
  .lightbox figcaption { color: #fff; font-size: 14px; }
  footer { color: var(--muted); font-size: 12px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1.6em 60px minmax(0, 1fr) auto; gap: 10px; padding: 10px; } .thumb, .noimg { width: 60px; height: 60px; } .qty { font-size: 22px; } .tile .v { font-size: 24px; } }
</style>
</head>

  if (notes.length) banners.append(el('div', { class: 'banner warn' }, '需要核对：', el('ul', {}, ...notes.map((n) => el('li', {}, n)))));

  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...['全部', ...forms.map((f) => f.form)].map((name) => {
    const b = el('button', { type: 'button', 'aria-pressed': String(state.form === name) }, name);
    b.onclick = () => { state.form = name; save(); render(); };
    return b;
  }));

  const items = shown.flatMap((f) => f.items);
  const byDate = Object.fromEntries(dates.map((d) => [d, items.reduce((s, it) => s + (it.by_date[d] || 0), 0)]));
  const pieces = items.reduce((s, it) => s + total(it), 0);
  const tile = (k, v, c) => el('div', { class: 'tile' }, el('div', { class: 'k' }, ...(c ? [el('i', { class: 'sw', style: `background:${c}` })] : []), k), el('div', { class: 'v' }, String(v)));
  document.getElementById('tiles').replaceChildren(
    tile('订单数', shown.reduce((s, f) => s + f.orders, 0)),
    tile('已订件数', pieces),
    tile(noPrice(items).length && amount(items) ? '总价（不含待定）' : '总价', amt(items)),
    ...(state.form === '全部' ? shown.map((f) => tile(`${f.form} 总价`, amt(f.items))) : []),
    ...dates.map((d) => tile(`${d} 取货`, byDate[d], color(d))),
  );

  const box = document.getElementById('forms');
  const short = (d) => d.replace(/（.*/, '');
  const sumLine = (list, extra) => (extra ? extra + ' · ' : '') + `共 ${list.reduce((s, it) => s + total(it), 0)} 件 · ${amt(list)} · ` +
    dates.map((d) => `${short(d)} ${list.reduce((s, it) => s + (it.by_date[d] || 0), 0)}`).join(' · ');
  const catSort = (a, b) => (CAT_ORDER.indexOf(a) + 99) % 99 - (CAT_ORDER.indexOf(b) + 99) % 99;

  const board = (list) => {
    const rows = list.filter((it) => !state.hideZero || total(it) > 0)
      .sort((x, y) => total(y) - total(x) || x.form.localeCompare(y.form) || x.item.localeCompare(y.item));
    if (!rows.length) return el('p', { class: 'empty' }, '还没有订单。');
    const max = Math.max(1, ...rows.map(total));
    let rank = 0, prev = null;
    return el('ol', { class: 'board' }, ...rows.map((it, i) => {
      const t = total(it);
      if (t !== prev) { rank = i + 1; prev = t; }
      const bar = el('div', { class: 'bar', role: 'img', 'aria-label': dates.map((d) => `${d} ${it.by_date[d] || 0} 件`).join('，') },
        ...dates.filter((d) => it.by_date[d]).map((d) => el('span', { style: `width:${(it.by_date[d] / max) * 100}%;background:${color(d)}` })));
      const split = dates.map((d) => el('span', {}, el('i', { class: 'sw', style: `background:${color(d)}` }), ` ${short(d)} ${it.by_date[d] || 0}`));
      return el('li', { class: 'row' + (t ? '' : ' zero') },
        el('span', { class: 'rank' }, t ? String(rank) : '–'),
        it.img ? picButton(it) : el('span', { class: 'noimg' }, '无图'),
        el('div', { class: 'info' },
          el('div', { class: 'name' }, it.item),
          el('div', { class: 'meta' }, ...(it.price ? [el('span', { class: 'tag' }, `${yen(it.price)} × ${t} = ${yen(it.price * t)}`)] : []), ...split),
          bar),
        el('span', { class: 'qty' }, String(t), el('small', {}, '件')));
    }));
  };

  const group = (key, title, line, ...body) => {
    const d = el('details', { class: 'group' }, el('summary', {}, el('span', { class: 't' }, title), el('small', {}, line)), ...body);
    d.open = !state.closed[key];
    d.addEventListener('toggle', () => { if (d.open) delete state.closed[key]; else state.closed[key] = 1; save(); });
    d.dataset.key = key;
    return d;
  };

    box.replaceChildren(...shown.map((f) => group('form:' + f.form, f.form, sumLine(f.items, `${f.orders} 张订单`),
      ...Array.from(new Set(f.items.map((it) => it.category))).sort(catSort)
        .filter((c) => !state.hideZero || f.items.some((it) => it.category === c && total(it) > 0))
        .map((c) => {
          const list = f.items.filter((it) => it.category === c);
          return el('div', { class: 'catblock' }, el('h3', {}, c, el('small', {}, sumLine(list))), board(list));
        }))));
}

const setAll = (open) => {
  document.querySelectorAll('#forms details.group').forEach((d) => {
    if (open) delete state.closed[d.dataset.key]; else state.closed[d.dataset.key] = 1;
  });
  save(); render();
};
document.getElementById('openall').onclick = () => setAll(true);
document.getElementById('closeall').onclick = () => setAll(false);
const hz = document.getElementById('hidezero');
hz.checked = state.hideZero;
hz.onchange = () => { state.hideZero = hz.checked; save(); render(); };
if (!DATA.forms.some((f) => f.form === state.form)) state.form = '全部';
render();
setTimeout(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
