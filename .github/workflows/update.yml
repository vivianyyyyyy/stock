name: 更新备货清单

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟（GitHub 高峰期可能会晚几分钟）
  workflow_dispatch:          # 也可以在 Actions 页面手动点 Run
  push:                       # 改了脚本、网页模板或价格图片设置后立刻跑一次
    branches: [main]
    paths: [stock.py, template.html, products.json, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-stock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取表单并生成网页
        env:
          SHEET_ED95: ${{ secrets.SHEET_ED95 }}
          SHEET_K2: ${{ secrets.SHEET_K2 }}
          SHEET_UNIT: ${{ secrets.SHEET_UNIT }}
        run: python3 stock.py
      - name: 有变化就提交
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/index.html
          # 数字没变时 stock.py 不会改文件，这里也就不提交
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "更新备货清单" && git push
          fi
